name: compose-verify

on:
  pull_request:
    branches: [main, v2]
    paths:
      - Dockerfile
      - docker-compose.yml
      - docker/**
      - app/**
      - content/**
      - package.json
      - package-lock.json
      - infra/**
      - .github/workflows/compose-verify.yml
  workflow_dispatch:

jobs:
  compose:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Docker Hub login
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate compose config
        run: docker compose config -q

      - name: Build images
        run: docker compose build

      - name: Start LocalStack
        run: docker compose up -d localstack

      - name: Wait for LocalStack healthy
        run: |
          cid=$(docker compose ps -q localstack)
          for i in $(seq 1 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$cid")
            if [ "$status" = healthy ]; then
              exit 0
            fi
            sleep 3
          done
          echo "LocalStack did not become healthy in time"
          docker compose logs localstack
          exit 1

      - name: Build Lambda package
        run: docker compose run --rm --no-deps lambda-builder

      - name: Terraform bootstrap against LocalStack
        run: docker compose run --rm --no-deps bootstrap

      - name: Start web and probe
        run: |
          docker compose up -d web
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000 >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          echo "web did not respond on :3000 in time"
          docker compose logs web
          exit 1

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Teardown
        if: always()
        run: docker compose down -v
