name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build static site via Docker
        id: meta
        run: |
          docker build --target builder -t portfolio-build:${{ github.sha }} .
          docker create --name extract portfolio-build:${{ github.sha }}
          docker cp extract:/app/out ./out
          docker rm extract
          echo "image=portfolio-build:${{ github.sha }}" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: site-out
          path: out/
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-out
          path: out

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync immutable assets first
        run: |
          aws s3 sync out/_next/static/ s3://${{ secrets.SITE_BUCKET }}/_next/static/ \
            --cache-control "public, max-age=31536000, immutable" \
            --delete

      - name: Sync the rest
        run: |
          aws s3 sync out/ s3://${{ secrets.SITE_BUCKET }}/ \
            --exclude "_next/static/*" \
            --cache-control "public, max-age=300, s-maxage=86400" \
            --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CF_DISTRIBUTION_ID }} \
            --paths "/*"
