name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  BUCKET: s3://${{ secrets.SITE_BUCKET }}
  PAGE_CACHE: public, max-age=300, s-maxage=86400

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync hashed assets
        run: |
          aws s3 sync out/_next/static/ "$BUCKET/_next/static/" \
            --cache-control "public, max-age=31536000, immutable" \
            --delete

      - name: Sync pages
        run: |
          aws s3 sync out/ "$BUCKET/" \
            --exclude "_next/static/*" \
            --exclude "*opengraph-image*" \
            --cache-control "$PAGE_CACHE" \
            --delete

      # The social cards are written without a file extension, so s3 can't
      # guess their type and it has to be spelled out. The last exclude keeps
      # the route's compiled js under _next out of this pass.
      - name: Sync social cards
        run: |
          aws s3 sync out/ "$BUCKET/" \
            --exclude "*" \
            --include "*opengraph-image*" \
            --exclude "_next/*" \
            --content-type "image/png" \
            --cache-control "$PAGE_CACHE" \
            --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CF_DISTRIBUTION_ID }} \
            --paths "/*"
