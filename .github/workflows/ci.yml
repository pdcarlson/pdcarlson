name: CI

on:
  pull_request:
    branches: [main, v2]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build static site
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: site-out
          path: out/
          retention-days: 7

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: fmt check
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: prod init (no backend)
        run: terraform -chdir=infra/terraform/envs/prod init -backend=false

      - name: prod validate
        run: terraform -chdir=infra/terraform/envs/prod validate
