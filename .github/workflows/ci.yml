name: ci

on:
  pull_request:
    branches: [main, v2]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build static site
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: site-out
          path: out/
          retention-days: 7
